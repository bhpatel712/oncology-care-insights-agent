name: Deploy Oncology Care Insights Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    name: Deploy Azure Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure connection
        run: |
          az account show
          echo "✅ Connected to Azure successfully!"

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: oncology-agent-rg
          template: infra/main.bicep
          parameters: infra/parameters.json
        continue-on-error: true

      - name: Deployment complete
        run: |
          echo "✅ Infrastructure deployment complete!"
          echo "Project: oncology-care-insights-agent"
          echo "Resource Group: oncology-agent-rg"